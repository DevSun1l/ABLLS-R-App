[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route /api/generate to the standalone AI function
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

# SPA fallback — serve index.html for all other routes (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
